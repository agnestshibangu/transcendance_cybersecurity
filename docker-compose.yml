configs:
  env_file:
    file: ./.env

  dhparam_pem:
    file: ./certs/dhparam-2048.pem

  selfsigned_key:
    file: ./certs/selfsigned.key

  selfsigned_crt:
    file: ./certs/selfsigned.crt

services:

  waf:
    networks:
      - app_network
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf
    ports:
      - "${WAF_HTTP_PORT}:80"
      - "${WAF_HTTPS_PORT}:443"
    restart: always
    tmpfs:
      - /secrets/waf:rw,size=10m,uid=101,gid=101
    volumes:
      - ./reverse-proxy/custom.conf:/etc/nginx/conf.d/custom.conf
      - frontend_dist:/usr/share/nginx/html
      - ./reverse-proxy/modsecurity.conf:/etc/modsecurity/modsecurity.conf
      - ./reverse-proxy/modsecurity-override.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      - ./reverse-proxy/waf-entrypoint.sh:/usr/local/bin/waf-entrypoint.sh:ro
      - vault_secrets_waf:/vault_secrets_waf:ro
    entrypoint: ["/usr/local/bin/waf-entrypoint.sh"]
    depends_on:
      - frontend
      - api-gateway
      - vault
      - logstash
 
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    networks:
      - app_network
    expose:
      - "${API_GATEWAY_PORT}"
    tmpfs:
      - /tmp/secrets:rw,size=10m
    volumes:
      - sqlite_data:/app/data
      - vault_secrets_apigateway:/secrets:ro
    depends_on:
      - authservice
      - vault
    restart: always
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:5000"
        tag: "api-gateway"

  dbwriter:
    build:
      context: ./dbwriter
      dockerfile: Dockerfile
    container_name: dbwriter
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/database.sqlite
    tmpfs:
      - /tmp/secrets:rw,size=10m
    volumes:
      - sqlite_data:/app/data
      - vault_secrets_dbwriter:/secrets:ro
    networks:
      - app_network
    expose:
      - "${DBWRITER_PORT}"
    restart: always
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:5000"
        tag: "dbwriter"

  authservice:
    networks:
      - app_network
    expose:
      - "${AUTHSERVICE_PORT}"
    build:
      context: ./authservice
      dockerfile: Dockerfile
    container_name: authservice
    tmpfs:
      - /tmp/secrets:rw,size=10m
    volumes:
      - sqlite_data:/app/data:ro 
      - vault_secrets_authservice:/secrets:ro
    restart: always
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:5000"
        tag: "authservice"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      - NODE_ENV=production
    command: npm run build
    volumes:
      - frontend_dist:/app/frontend/dist
    networks:
      - app_network
    restart: "no"

  vault:
    configs:
      - source: env_file
        target: /tmp/env
        mode: 0444

      - source: dhparam_pem
        target: /tmp/dhparam-2048.pem
        mode: 0444

      - source: selfsigned_key
        target: /tmp/selfsigned.key
        mode: 0444

      - source: selfsigned_crt
        target: /tmp/selfsigned.crt
        mode: 0444
    image: hashicorp/vault:1.21.1
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
     - VAULT_ADDR=http://0.0.0.0:8200
    networks:
      - app_network
    expose:
      - "${VAULT_PORT}"
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl 
      - vault_data:/vault/file
      - vault_keys:/vault/keys
      - ./vault/vault-init.sh:/vault/vault-init.sh
      - ./vault/vault-start.sh:/vault/vault-start.sh
      - ./vault/load-secrets.sh:/vault/load-secrets.sh
      - ./vault/test-script.sh:/vault/test-script.sh

      - ./vault/secrets-from-vault/secrets-apigateway.sh:/vault/secrets-apigateway.sh
      - ./vault/secrets-from-vault/secrets-authservice.sh:/vault/secrets-authservice.sh
      - ./vault/secrets-from-vault/secrets-dbwriter.sh:/vault/secrets-dbwriter.sh
      - ./vault/secrets-from-vault/secrets-waf.sh:/vault/secrets-waf.sh
      - ./vault/secrets-from-vault/secrets-elk.sh:/vault/secrets-elk.sh
      - ./vault/elk/elk-policy.hcl:/vault/elk/elk-policy.hcl:ro
      - ./vault/api-gateway/api-gateway-policy.hcl:/vault/api-gateway/api-gateway-policy.hcl:ro
      - ./vault/authservice/authservice-policy.hcl:/vault/authservice/authservice-policy.hcl:ro
      - ./vault/dbwriter/dbwriter-policy.hcl:/vault/dbwriter/dbwriter-policy.hcl:ro
      - ./vault/waf/waf-policy.hcl:/vault/waf/waf-policy.hcl:ro

      - vault_secrets_apigateway:/secrets/apigateway
      - vault_secrets_authservice:/secrets/authservice
      - vault_secrets_dbwriter:/secrets/dbwriter
      - vault_secrets_waf:/secrets/waf
      - vault_secrets_elk:/secrets/elk

    entrypoint: >
      sh -c "
        apk add --no-cache bash jq &&
        chmod +x vault-start.sh
        chmod +x vault-init.sh
        chmod +x load-secrets.sh
        chmod +x get-secrets-from-vault.sh
        bash /vault/vault-start.sh
      "
    restart: always
  
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: blockchain
    networks:
      - app_network
    volumes:
      - ./blockchain/content:/app/content
    restart: always
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:5000"
        tag: "blockchain"

###################################################################################################

  elk-security-setup:
    image: curlimages/curl:8.5.0
    container_name: elk-security-setup
    networks:
      - app_network
    tmpfs:
      - /secrets:rw,size=10m
    volumes:
      - certs:/certs:ro
      - ./elk/entrypoints/elk-env-entrypoint.sh:/usr/local/bin/elk-env-entrypoint.sh:ro
      - vault_secrets_elk:/secrets/elk:ro
      - ./elk/scripts/elk-security-setup.sh:/usr/local/bin/elk-security-setup.sh:ro
    entrypoint: ["/usr/local/bin/elk-env-entrypoint.sh"]
    command: ["sh", "/usr/local/bin/elk-security-setup.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy
        #condition: service_started
    restart: "no"

  kibana-setup:
    image: curlimages/curl:8.5.0
    container_name: kibana-setup
    networks:
      - app_network
    volumes:
      - ./elk/scripts/kibana-setup.sh:/usr/local/bin/kibana-setup.sh:ro
      - ./elk/entrypoints/elk-env-entrypoint.sh:/usr/local/bin/elk-env-entrypoint.sh:ro
      - vault_secrets_elk:/secrets/elk:ro
    entrypoint: ["/usr/local/bin/elk-env-entrypoint.sh"]
    command: ["sh", "/usr/local/bin/kibana-setup.sh"]
    depends_on:
      elk-security-setup:
        condition: service_completed_successfully
      kibana:
        condition: service_started
    restart: "no"
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elk-setup
    user: "0"
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - ./elk/instances.yml:/usr/share/elasticsearch/config/instances.yml:ro
      - ./elk/scripts/elk-certs.sh:/usr/local/bin/elk-certs.sh:ro
    entrypoint: ["bash", "/usr/local/bin/elk-certs.sh"]
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/elasticsearch/config/certs/ca/ca.crt && test -f /usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.crt"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: "no"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    networks:
      - app_network
    tmpfs:
      - /secrets:rw,size=10m
    ports:
      - "127.0.0.1:5000:5000/udp"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - certs:/usr/share/logstash/config/certs:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/entrypoints/elk-env-entrypoint.sh:/usr/local/bin/elk-env-entrypoint.sh:ro
      - vault_secrets_elk:/secrets/elk:ro
    entrypoint: ["/usr/local/bin/elk-env-entrypoint.sh"]
    command: ["logstash"]
    depends_on:
      elasticsearch:
        condition: service_started
      elk-security-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9600/_node/pipelines >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u elastic:$${ELASTIC_PASSWORD} https://localhost:9200 >/dev/null"]
      interval: 5s
      retries: 30
      timeout: 5s
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    tmpfs:
      - /secrets:rw,size=10m
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - es_data:/usr/share/elasticsearch/data
      - ./elk/entrypoints/elk-env-entrypoint.sh:/usr/local/bin/elk-env-entrypoint.sh:ro
      - vault_secrets_elk:/secrets/elk:ro
    entrypoint: ["/usr/local/bin/elk-env-entrypoint.sh"]
    command: ["/usr/local/bin/docker-entrypoint.sh", "eswrapper"]
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - app_network
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca/ca.crt
    tmpfs:
      - /secrets:rw,size=10m
    volumes:
      - certs:/usr/share/kibana/config/certs:ro
      - ./elk/entrypoints/elk-env-entrypoint.sh:/usr/local/bin/elk-env-entrypoint.sh:ro
      - vault_secrets_elk:/secrets/elk:ro
    entrypoint: ["/usr/local/bin/elk-env-entrypoint.sh"]
    command: ["/usr/local/bin/kibana-docker"]
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - app_network
    restart: always
    depends_on:
      elasticsearch:
        condition: service_started
      elk-security-setup:
        condition: service_completed_successfully

volumes:
  sqlite_data:
  vault_data:
  certs:
  es_data:
  vault_keys:
  frontend_dist:
  vault_secrets_waf:
  vault_secrets_elk:
  vault_secrets_authservice:
  vault_secrets_apigateway:
  vault_secrets_dbwriter:


networks:
  app_network:
    driver: bridge