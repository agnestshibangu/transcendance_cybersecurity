server {
    listen 80 default_server;
    server_name localhost _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name localhost _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    
    ssl_certificate /secrets/waf/selfsigned.crt;
    ssl_certificate_key /secrets/waf/selfsigned.key;
    ssl_dhparam /secrets/waf/dhparam-2048.pem;

    large_client_header_buffers 4 16k;

    modsecurity on;

    # Allow Google OAuth popup to work
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        #modsecurity off;
        
        proxy_pass http://api-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

     location /auth/ {

        proxy_pass http://authservice:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IMPORTANT pour POST JSON
        proxy_set_header Connection "";
    }
    location /kibana/ {
        proxy_pass http://kibana:5601/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

